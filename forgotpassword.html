<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?display=swap&amp;family=Newsreader:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700;900" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1173d4",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Newsreader", "serif"],
            "body": ["Noto Sans", "sans-serif"],
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    body {
        font-family: 'body', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100">
<div class="relative flex min-h-screen flex-col justify-center overflow-hidden py-6 sm:py-12">
<div class="relative bg-white dark:bg-gray-800 px-6 pb-8 pt-10 shadow-xl ring-1 ring-gray-900/5 sm:mx-auto sm:max-w-lg sm:rounded-xl sm:px-10">
<div class="mx-auto max-w-md text-center">
<div class="flex justify-center mb-6">
<span class="material-symbols-outlined text-primary text-6xl">lock_reset</span>
</div>
<h1 class="text-3xl font-display font-bold text-gray-900 dark:text-gray-100">Forgot Password</h1>
<p class="mt-4 text-gray-600 dark:text-gray-300">Enter your registered email below to receive password reset instructions.</p>
<div class="mt-8">
<form action="" class="space-y-6">
<div>
<label class="sr-only" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                         mail
                       </span>
<input autocomplete="email" class="block w-full rounded-md border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 py-3 pl-10 pr-3 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 focus:border-primary focus:outline-none focus:ring-primary sm:text-sm" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-md border border-transparent bg-primary px-4 py-3 text-base font-medium text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">Send Reset Link</button>
</div>
</form>
<div class="mt-6 text-center">
<a class="text-sm font-medium text-primary hover:text-primary/90" href="#">
                   Back to Login
                </a>
</div>
</div>
</div>
</div>
</div>

</body></html>
