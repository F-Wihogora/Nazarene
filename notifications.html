<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notifications</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?display=swap&amp;family=Newsreader:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700;900" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Newsreader"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      .material-symbols-outlined.fill {
        font-variation-settings: 'FILL' 1;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100">
<div class="relative flex h-auto min-h-screen w-full flex-col justify-between">
<div class="flex-grow">
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center justify-between p-4">
<button class="flex items-center justify-center p-2 text-gray-600 dark:text-gray-300">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-center flex-1">Notifications</h1>
<div class="w-10"></div>
</div>
</header>
<main class="px-4">
<section class="mt-4">
<h2 class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-2">Today</h2>
<div class="space-y-3">
<div class="flex items-start gap-4 p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm">
<div class="flex items-center justify-center rounded-full bg-primary/10 text-primary size-10 shrink-0">
<span class="material-symbols-outlined">church</span>
</div>
<div class="flex-grow">
<p class="font-semibold text-gray-900 dark:text-gray-100">Sunday Service Reminder</p>
<p class="text-sm text-gray-500 dark:text-gray-400">10:30 AM</p>
</div>
<span class="w-2.5 h-2.5 bg-primary rounded-full mt-1"></span>
</div>
<div class="flex items-start gap-4 p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm">
<div class="flex items-center justify-center rounded-full bg-primary/10 text-primary size-10 shrink-0">
<span class="material-symbols-outlined">groups</span>
</div>
<div class="flex-grow">
<p class="font-semibold text-gray-900 dark:text-gray-100">Youth Group Meeting</p>
<p class="text-sm text-gray-500 dark:text-gray-400">2:00 PM</p>
</div>
<span class="w-2.5 h-2.5 bg-primary rounded-full mt-1"></span>
</div>
</div>
</section>
<section class="mt-6">
<h2 class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-2">Yesterday</h2>
<div class="space-y-3">
<div class="flex items-start gap-4 p-3 bg-white/70 dark:bg-gray-800/70 rounded-lg">
<div class="flex items-center justify-center rounded-full bg-primary/10 text-primary size-10 shrink-0">
<span class="material-symbols-outlined">ondemand_video</span>
</div>
<div class="flex-grow">
<p class="font-semibold text-gray-700 dark:text-gray-300">New Sermon Available</p>
<p class="text-sm text-gray-500 dark:text-gray-400">11:00 AM</p>
</div>
</div>
<div class="flex items-start gap-4 p-3 bg-white/70 dark:bg-gray-800/70 rounded-lg">
<div class="flex items-center justify-center rounded-full bg-primary/10 text-primary size-10 shrink-0">
<span class="material-symbols-outlined">task_alt</span>
</div>
<div class="flex-grow">
<p class="font-semibold text-gray-700 dark:text-gray-300">Event Approval Status</p>
<p class="text-sm text-gray-500 dark:text-gray-400">3:00 PM</p>
</div>
</div>
</div>
</section>
</main>
</div>
<footer class="sticky bottom-0 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm border-t border-gray-200 dark:border-gray-700">
<nav class="flex justify-around items-center px-4 py-2">
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">event</span>
<span class="text-xs font-medium">Events</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">movie</span>
<span class="text-xs font-medium">Sermons</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill">notifications</span>
<span class="text-xs font-medium">Notifications</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-xs font-medium">Profile</span>
</a>
</nav>
</footer>
</div>

</body></html>
