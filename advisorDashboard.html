<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Advisor Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col justify-between">
<div class="flex-grow">
<header class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800">
<button class="text-gray-800 dark:text-white">
<svg class="feather feather-menu" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
</button>
<h1 class="text-lg font-bold text-gray-900 dark:text-white">Dashboard</h1>
<div class="w-6"></div>
</header>
<main class="p-4">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<h3 class="text-base font-medium text-gray-600 dark:text-gray-400">Church Growth</h3>
<div class="flex items-baseline gap-2 mt-1">
<p class="text-2xl font-bold text-gray-900 dark:text-white">+15%</p>
<span class="text-sm font-medium text-green-500">+15% vs last month</span>
</div>
</div>
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<h3 class="text-base font-medium text-gray-600 dark:text-gray-400">Offering Trends</h3>
<div class="flex items-baseline gap-2 mt-1">
<p class="text-2xl font-bold text-gray-900 dark:text-white">+8%</p>
<span class="text-sm font-medium text-green-500">+8% vs last month</span>
</div>
</div>
<div class="col-span-1 sm:col-span-2 bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<h3 class="text-base font-medium text-gray-600 dark:text-gray-400">Event Attendance</h3>
<div class="flex items-baseline gap-2 mt-1">
<p class="text-2xl font-bold text-gray-900 dark:text-white">250</p>
<span class="text-sm font-medium text-green-500">+10% vs last event</span>
</div>
</div>
</div>
<div class="mt-8">
<h2 class="text-lg font-bold text-gray-900 dark:text-white">Detailed Reports</h2>
<a class="mt-2 flex items-center justify-between bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors" href="#">
<p class="font-medium text-gray-800 dark:text-gray-200">View Full Reports</p>
<svg class="feather feather-chevron-right text-gray-400" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><polyline points="9 18 15 12 9 6"></polyline></svg>
</a>
</div>
</main>
</div>
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-800">
<nav class="flex justify-around p-2">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<svg class="text-primary" fill="currentColor" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<svg class="feather feather-calendar" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>
<span class="text-xs font-medium">Events</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<svg class="feather feather-video" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect height="14" rx="2" ry="2" width="15" x="1" y="5"></rect></svg>
<span class="text-xs font-medium">Sermons</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<svg class="feather feather-dollar-sign" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><line x1="12" x2="12" y1="1" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
<span class="text-xs font-medium">Donate</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<svg class="feather feather-phone" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
<span class="text-xs font-medium">Contact</span>
</a>
</nav>
</footer>
</div>

</body></html>
