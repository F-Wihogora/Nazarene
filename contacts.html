<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8B5CF6", // A warmer purple
                        "primary-dark": "#7C3AED",
                        "background-light": "#FDFBF8", // A warmer off-white
                        "background-dark": "#1C1917", // A warmer dark gray

                        "text-dark": "#E7E5E4",
                        "subtle-light": "#A8A29E",
                        "subtle-dark": "#57534E",
                        "border-light": "#E7E5E4",
                        "border-dark": "#44403C",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],

                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "0.75rem",
                        xl: "1rem",
                        full: "9999px",

                },

<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="flex flex-col h-screen justify-between">
<main class="flex-grow overflow-y-auto">
<div id="zzz-header"></div>
<div class="p-4 space-y-8">
<div>
<h2 class="text-lg font-semibold mb-4 text-text-light dark:text-text-dark">
                        Find Us
                    </h2>
<div class="rounded-xl overflow-hidden border border-border-light dark:border-border-dark">
<img alt="Map showing the location of Nazarene Remera Church" class="w-full h-48 object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJgSQlcbqkmRNLUE3wEEjNYadr2R1Ntj49HmLH4TqzHW4lybh5SmLDYxTFrGmtzEASKEJ8l6jy6MIn2ndMC_gvUygSNwKWOwLfNDPg20vj2gNroLnLiIJEmShgIvTCQyyHt-wEWHAMAkIZxoQYIe8tXj3hcL393VcJYt6nHH_7VDjJJ4PCqJdNnGChUS934yzlIC0e9rZL6HsSjWrvpR3VXcVMJPonm8hIQyUU0e-ZYYAzQX4VCHcJLN71XsUsP_EnWnOxbKeT"/>
</div>
</div>
<div>
<h2 class="text-lg font-semibold mb-4 text-text-light dark:text-text-dark">
                        Send us a Message
                    </h2>
<form class="space-y-4">
<div>
<label class="block text-sm font-medium text-subtle-light dark:text-subtle-dark mb-1" for="name">Name</label>
<input class="w-full px-4 py-3 rounded-lg border border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark focus:ring-primary focus:border-primary text-text-light dark:text-text-dark placeholder-subtle-light dark:placeholder-subtle-dark" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-subtle-light dark:text-subtle-dark mb-1" for="email">Email</label>
<input class="w-full px-4 py-3 rounded-lg border border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark focus:ring-primary focus:border-primary text-text-light dark:text-text-dark placeholder-subtle-light dark:placeholder-subtle-dark" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-subtle-light dark:text-subtle-dark mb-1" for="message">Message</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark focus:ring-primary focus:border-primary text-text-light dark:text-text-dark placeholder-subtle-light dark:placeholder-subtle-dark" id="message" name="message" placeholder="Your message here..." rows="4"></textarea>
</div>
<button class="w-full bg-primary text-white font-bold py-3 rounded-lg text-lg hover:bg-primary-dark transition-colors" type="submit">
              Send Message
            </button>
</form>
</div>
<div>
<a class="flex items-center justify-center gap-3 w-full bg-[#25D366] text-white font-bold py-3 rounded-lg text-lg hover:bg-[#128C7E] transition-colors" href="#">

</div>
</div>
