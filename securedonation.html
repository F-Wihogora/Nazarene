<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stitch Design</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1173d4",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Newsreader"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col min-h-screen justify-between">
<div class="flex-grow">
<header class="flex items-center p-4">
<button class="text-gray-800 dark:text-gray-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-bold text-lg text-gray-900 dark:text-gray-100 pr-8">Donate</h1>
</header>
<main class="p-4">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-gray-900 dark:text-gray-100">lock</span>
<h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Secure Donation</h2>
</div>
<div class="space-y-6">
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">$</span>
<input class="w-full h-14 pl-8 pr-4 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-gray-100 focus:ring-primary focus:border-primary placeholder-gray-400 dark:placeholder-gray-500" placeholder="Enter Amount" type="number"/>
</div>
<div>
<select class="w-full h-14 px-4 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-gray-100 focus:ring-primary focus:border-primary">
<option>Tithe</option>
<option>Offering</option>
<option>Building Fund</option>
<option>Missions</option>
<option>Other</option>
</select>
</div>
<div>
<h3 class="font-bold text-lg mb-3 text-gray-900 dark:text-gray-100">Payment Method</h3>
<div class="grid grid-cols-2 gap-4">
<label class="flex items-center justify-center p-4 rounded-lg border-2 border-gray-200 dark:border-gray-700 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/10">
<input class="sr-only" name="payment_method" type="radio" value="mobile_money"/>
<span class="font-medium text-gray-800 dark:text-gray-200">Mobile Money</span>
</label>
<label class="flex items-center justify-center p-4 rounded-lg border-2 border-gray-200 dark:border-gray-700 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/10">
<input checked="" class="sr-only" name="payment_method" type="radio" value="paypal"/>
<span class="font-medium text-gray-800 dark:text-gray-200">PayPal</span>
</label>
</div>
</div>
<button class="w-full h-14 rounded-lg bg-primary text-white font-bold text-base tracking-wide flex items-center justify-center">
            Donate
          </button>
</div>
</main>
</div>
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-700">
<nav class="flex justify-around items-center h-20">
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-xs font-medium">Events</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">movie</span>
<span class="text-xs font-medium">Sermons</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">paid</span>
<span class="text-xs font-bold">Donate</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">call</span>
<span class="text-xs font-medium">Contact</span>
</a>
</nav>
<div class="h-safe-area-bottom bg-background-light dark:bg-background-dark"></div>
</footer>
</div>

</body></html>
