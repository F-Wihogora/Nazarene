<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sermons - Nazarene Remera Church</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d46211",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221810",
                    },
                    fontFamily: {
                        "display": ["Newsreader"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-stone-900 dark:text-stone-100">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center p-4">
<button class="p-2 text-stone-900 dark:text-stone-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-xl font-bold text-center text-stone-900 dark:text-stone-100 mr-10">Sermons</h1>
</div>
<div class="h-px bg-primary/20"></div>
</header>
<main class="flex-grow p-4 space-y-6">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="sermon-title">Sermon Title</label>
<input class="w-full bg-stone-100 dark:bg-stone-800 border-stone-300 dark:border-stone-700 rounded-lg p-3 focus:ring-primary focus:border-primary placeholder-stone-500 dark:placeholder-stone-400 text-stone-900 dark:text-stone-100" id="sermon-title" name="sermon-title" placeholder="Enter sermon title" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="topic">Topic</label>
<input class="w-full bg-stone-100 dark:bg-stone-800 border-stone-300 dark:border-stone-700 rounded-lg p-3 focus:ring-primary focus:border-primary placeholder-stone-500 dark:placeholder-stone-400 text-stone-900 dark:text-stone-100" id="topic" name="topic" placeholder="Enter sermon topic" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="date">Date</label>
<input class="w-full bg-stone-100 dark:bg-stone-800 border-stone-300 dark:border-stone-700 rounded-lg p-3 focus:ring-primary focus:border-primary placeholder-stone-500 dark:placeholder-stone-400 text-stone-900 dark:text-stone-100" id="date" name="date" type="date"/>
</div>
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="media-type">Media Type</label>
<select class="w-full bg-stone-100 dark:bg-stone-800 border-stone-300 dark:border-stone-700 rounded-lg p-3 focus:ring-primary focus:border-primary text-stone-900 dark:text-stone-100" id="media-type" name="media-type">
<option>Select media type</option>
<option>Video</option>
<option>Audio</option>
<option>Link</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="media-upload">Upload Media</label>
<div class="mt-2 flex justify-center rounded-lg border border-dashed border-stone-400/50 dark:border-stone-600/50 px-6 py-10 bg-stone-100/50 dark:bg-stone-800/50">
<div class="text-center">
<span class="material-symbols-outlined text-4xl text-stone-400 dark:text-stone-500">cloud_upload</span>
<div class="mt-4 flex text-sm leading-6 text-stone-600 dark:text-stone-400">
<label class="relative cursor-pointer rounded-md font-semibold text-primary hover:text-primary/80" for="file-upload">
<span>Upload a file</span>
<input class="sr-only" id="file-upload" name="file-upload" type="file"/>
</label>
<p class="pl-1">or drag and drop</p>
</div>
<p class="text-xs leading-5 text-stone-500 dark:text-stone-400">MP4, MOV, MP3 up to 500MB</p>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-2" for="media-link">Or Media Link</label>
<input class="w-full bg-stone-100 dark:bg-stone-800 border-stone-300 dark:border-stone-700 rounded-lg p-3 focus:ring-primary focus:border-primary placeholder-stone-500 dark:placeholder-stone-400 text-stone-900 dark:text-stone-100" id="media-link" name="media-link" placeholder="https://youtube.com/..." type="url"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary text-white font-bold py-3 px-4 rounded-xl hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-colors" type="submit">
                        Save Sermon
                    </button>
</div>
</form>
</main>
<footer class="sticky bottom-0 z-10 bg-background-light dark:bg-background-dark border-t border-primary/20">
<nav class="flex justify-around p-2">
<a class="flex flex-col items-center justify-center w-1/4 text-stone-500 dark:text-stone-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-xs font-medium">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center w-1/4 text-primary dark:text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">smart_display</span>
<span class="text-xs font-bold">Sermons</span>
</a>
<a class="flex flex-col items-center justify-center w-1/4 text-stone-500 dark:text-stone-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-xs font-medium">Reports</span>
</a>
<a class="flex flex-col items-center justify-center w-1/4 text-stone-500 dark:text-stone-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="text-xs font-medium">Members</span>
</a>
</nav>
</footer>
</div>

</body></html>
