<!DOCTYPE html>
<html lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Newsreader"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col justify-between overflow-x-hidden">
<div class="flex-grow">
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark px-4 pt-6 pb-4">
<div class="relative">
<input class="w-full rounded-full border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 h-12 pl-12 pr-4 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" placeholder="Search sermons..." type="text"/>
<div class="absolute inset-y-0 left-0 flex items-center pl-4">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400">search</span>
</div>
</div>
<div class="flex items-center gap-2 mt-3">
<button class="flex items-center gap-2 rounded-full border border-gray-300 dark:border-gray-700 px-4 py-2 text-sm text-gray-700 dark:text-gray-300">
<span>Filter</span>
<span class="material-symbols-outlined text-base">filter_list</span>
</button>
<button class="flex items-center gap-2 rounded-full border border-gray-300 dark:border-gray-700 px-4 py-2 text-sm text-gray-700 dark:text-gray-300">
<span>Sort by: Relevance</span>
<span class="material-symbols-outlined text-base">arrow_drop_down</span>
</button>
</div>
</header>
<main class="p-4">
<div class="flex flex-col gap-4">
<div class="rounded-lg bg-white dark:bg-gray-800 p-4 shadow-sm">
<h3 class="font-bold text-lg text-gray-800 dark:text-white">Living a Life of Purpose</h3>
<p class="text-sm text-gray-600 dark:text-gray-400">Pastor John Doe | May 26, 2024</p>
<p class="text-sm text-primary mt-1">Category: Faith</p>
</div>
<div class="rounded-lg bg-white dark:bg-gray-800 p-4 shadow-sm">
<h3 class="font-bold text-lg text-gray-800 dark:text-white">The Power of Forgiveness</h3>
<p class="text-sm text-gray-600 dark:text-gray-400">Pastor Jane Smith | May 19, 2024</p>
<p class="text-sm text-primary mt-1">Category: Grace</p>
</div>
<div class="rounded-lg bg-white dark:bg-gray-800 p-4 shadow-sm">
<h3 class="font-bold text-lg text-gray-800 dark:text-white">Finding Joy in Service</h3>
<p class="text-sm text-gray-600 dark:text-gray-400">Guest Speaker | May 12, 2024</p>
<p class="text-sm text-primary mt-1">Category: Community</p>
</div>
</div>
</main>
</div>
