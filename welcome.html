<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Two-Factor Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Newsreader"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
<style>
      .form-radio:checked {
        background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%231173d4' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="flex h-screen flex-col">
<header class="flex items-center justify-between p-4">
<button class="flex items-center justify-center rounded-full p-2 hover:bg-primary/10 dark:hover:bg-primary/20">
<span class="material-symbols-outlined text-slate-800 dark:text-slate-200"> arrow_back </span>
</button>
<h1 class="flex-1 text-center text-xl font-bold">Two-Factor Authentication</h1>
<div class="w-10"></div>
</header>
<main class="flex-1 overflow-y-auto p-6">
<div class="text-center">
<h2 class="text-2xl font-bold">Choose a 2FA Method</h2>
<p class="mt-2 text-slate-600 dark:text-slate-400">Select how you'd like to receive your verification codes.</p>
</div>
<div class="mt-8 space-y-4">
<label class="flex cursor-pointer items-center gap-4 rounded-lg border border-slate-300 bg-white p-4 ring-primary has-[:checked]:border-primary has-[:checked]:ring-2 dark:border-slate-700 dark:bg-slate-800">
<div class="flex flex-1 flex-col">
<span class="font-semibold">Authenticator App</span>
<span class="text-sm text-slate-500 dark:text-slate-400">Use an app like Google Authenticator to generate codes.</span>
</div>
<input checked="" class="h-5 w-5 border-slate-300 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 dark:border-slate-600" name="2fa-method" type="radio"/>
</label>
<label class="flex cursor-pointer items-center gap-4 rounded-lg border border-slate-300 bg-white p-4 ring-primary has-[:checked]:border-primary has-[:checked]:ring-2 dark:border-slate-700 dark:bg-slate-800">
<div class="flex flex-1 flex-col">
<span class="font-semibold">SMS</span>
<span class="text-sm text-slate-500 dark:text-slate-400">Receive codes via text message.</span>
</div>
<input class="h-5 w-5 border-slate-300 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 dark:border-slate-600" name="2fa-method" type="radio"/>
</label>
</div>
</main>
<footer class="p-4">
<button class="w-full rounded-lg bg-primary py-3 text-lg font-bold text-white transition-colors hover:bg-primary/90">Continue</button>
</footer>
</div>


</body></html>
