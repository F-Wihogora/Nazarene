<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter:wght@400;500;700;900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1173d4",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col justify-between">
<div>
<header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<button class="text-stone-800 dark:text-white">
<span class="material-symbols-outlined text-3xl">
            menu
          </span>
</button>
<h1 class="text-xl font-bold text-stone-800 dark:text-white">Dashboard</h1>
<div class="w-8"></div>
</header>
<main class="p-4">
<section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
<div class="flex flex-col gap-2 rounded-lg bg-primary/10 dark:bg-primary/20 p-4">
<p class="text-stone-600 dark:text-stone-300 font-medium">Registered Members</p>
<p class="text-3xl font-bold text-stone-800 dark:text-white">250</p>
</div>
<div class="flex flex-col gap-2 rounded-lg bg-primary/10 dark:bg-primary/20 p-4">
<p class="text-stone-600 dark:text-stone-300 font-medium">Weekly Attendance</p>
<p class="text-3xl font-bold text-stone-800 dark:text-white">180</p>
</div>
<div class="col-span-1 sm:col-span-3 flex flex-col gap-2 rounded-lg bg-primary/10 dark:bg-primary/20 p-4">
<p class="text-stone-600 dark:text-stone-300 font-medium">Upcoming Events</p>
<p class="text-3xl font-bold text-stone-800 dark:text-white">5</p>
</div>
</section>
<section class="mt-8">
<h2 class="text-lg font-bold text-stone-800 dark:text-white px-4 pb-3 pt-5">Quick Actions</h2>
<div class="flex flex-col items-stretch gap-4 px-4 py-3">
<button class="flex items-center justify-center rounded-lg h-12 px-4 bg-primary text-white text-base font-bold">
<span>Manage Members</span>
</button>
<button class="flex items-center justify-center rounded-lg h-12 px-4 bg-primary/20 dark:bg-primary/30 text-primary text-base font-bold">
<span>Record Attendance</span>
</button>
<button class="flex items-center justify-center rounded-lg h-12 px-4 bg-primary/20 dark:bg-primary/30 text-primary text-base font-bold">
<span>Create Event</span>
</button>
</div>
</section>
</main>
</div>
<footer class="sticky bottom-0 border-t border-stone-200 dark:border-stone-800 bg-background-light dark:bg-background-dark/80 backdrop-blur-sm">
<nav class="flex justify-around py-2">
<a class="flex flex-col items-center justify-end gap-1 text-primary" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-xs font-medium">Home</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-stone-500 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<p class="text-xs font-medium">Events</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-stone-500 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">movie</span>
<p class="text-xs font-medium">Sermons</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-stone-500 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">favorite</span>
<p class="text-xs font-medium">Donate</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-stone-500 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">call</span>
<p class="text-xs font-medium">Contact</p>
</a>
</nav>
</footer>
</div>

</body></html>
